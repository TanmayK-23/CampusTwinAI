version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: campus_twin_db
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_password
      POSTGRES_DB: campus_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
